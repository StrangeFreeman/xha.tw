name: Build and deploy xha.tw

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xha-tw-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static website
        run: bun run build

      - name: Verify essential routes
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/admin/index.html
          test -f dist/admin/config.yml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload VPS artifact
        uses: actions/upload-artifact@v4
        with:
          name: xha-tw-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy backup to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vps:
    needs: build
    if: ${{ vars.VPS_HOST != '' && vars.VPS_USER != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://xha.tw
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: xha-tw-dist
          path: dist

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete-delay \
            --delay-updates \
            dist/ "$VPS_USER@$VPS_HOST:/srv/xha.tw/"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/xha.tw:/srv/blog:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

  shlink:
    image: shlinkio/shlink:stable
    profiles: [shlink]
    restart: unless-stopped
    environment:
      DEFAULT_DOMAIN: go.xha.tw
      IS_HTTPS_ENABLED: 'true'
      DISABLE_IP_TRACKING: 'true'
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    profiles: [shlink]
    restart: unless-stopped
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shlink -d shlink']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

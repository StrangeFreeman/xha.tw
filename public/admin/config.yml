backend:
  name: github
  repo: StrangeFreeman/xha.tw
  branch: main
  base_url: https://auth.xha.tw
  auth_endpoint: auth
  site_domain: xha.tw
  squash_merges: true
  preview_context: deploy-preview

publish_mode: editorial_workflow
site_url: https://xha.tw
display_url: https://xha.tw
show_preview_links: true
local_backend: true

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: 網站設定
    files:
      - name: site
        preview_path: ''
        label: 基本資料
        file: src/data/site.json
        format: json
        fields:
          - { label: 網站名稱, name: title, widget: string }
          - { label: 作者名稱, name: author, widget: string }
          - { label: 網站說明, name: description, widget: text }
          - { label: 所在位置, name: location, widget: string }
          - { label: GitHub 標籤, name: githubLabel, widget: string }
          - { label: GitHub 網址, name: githubUrl, widget: string }
          - { label: 原始碼按鈕文字, name: sourceLabel, widget: string }
          - { label: 原始碼網址, name: sourceUrl, widget: string }
          - { label: 顯示原始碼按鈕, name: showSource, widget: boolean, default: true }
          - {
              label: 自訂頭像,
              name: avatarUrl,
              widget: image,
              required: false,
              hint: 留空時使用 repo 內建頭像。
            }

  - name: pages
    label: 頁面與導覽
    files:
      - name: home
        preview_path: ''
        label: 首頁
        file: src/data/pages/home.json
        format: json
        fields:
          - &key { label: 內部識別碼, name: key, widget: hidden }
          - &title { label: 頁面標題, name: title, widget: string }
          - &nav_label { label: 導覽列名稱, name: navigationLabel, widget: string }
          - &path { label: 固定路徑, name: path, widget: hidden }
          - &nav_order { label: 導覽順序, name: navigationOrder, widget: number, value_type: int }
          - &enabled { label: 啟用頁面, name: enabled, widget: boolean, default: true }
          - &show_nav {
              label: 顯示於導覽列,
              name: showInNavigation,
              widget: boolean,
              default: true
            }
          - &view { label: 顯示瀏覽次數, name: view, widget: boolean, default: false }
          - &comment { label: 開放留言, name: comment, widget: boolean, default: false }
          - &description { label: SEO 說明, name: description, widget: text, required: false }
          - label: Content Blocks
            name: blocks
            widget: list
            required: false
            typeKey: type
            types:
              - &rich_text
                label: Rich Text
                name: rich-text
                widget: object
                summary: 'Rich Text · {{fields.title}}'
                fields:
                  - &block_id {
                      label: URL 識別碼,
                      name: id,
                      widget: string,
                      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 只能使用小寫英文字母、數字與連字號]
                    }
                  - &block_title { label: 標題, name: title, widget: string, required: false }
                  - &block_visible { label: 顯示, name: visible, widget: boolean, default: true }
                  - &block_heading {
                      label: 顯示標題,
                      name: showHeading,
                      widget: boolean,
                      default: true
                    }
                  - &block_toc {
                      label: 加入頁面目錄,
                      name: showInToc,
                      widget: boolean,
                      default: true
                    }
                  - { label: 內容, name: content, widget: markdown, required: false }
                  - { label: 按鈕文字, name: buttonLabel, widget: string, required: false }
                  - { label: 按鈕網址, name: buttonUrl, widget: string, required: false }
              - &card_list
                label: Card List
                name: card-list
                widget: object
                summary: 'Card List · {{fields.title}}'
                fields: &feature_card_fields
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 卡片排列
                    name: layout
                    widget: select
                    default: stack
                    options:
                      - { label: 直向寬卡片, value: stack }
                      - { label: 雙欄卡片, value: grid }
                  - label: Cards
                    name: cards
                    widget: list
                    add_to_top: true
                    hint: 新增卡片會放在最上方，可拖曳調整順序。
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { label: 標題, name: title, widget: string }
                      - { label: 副標題, name: subtitle, widget: string, required: false }
                      - { label: 日期或補充文字, name: date, widget: string, required: false }
                      - { label: 網址, name: href, widget: string, required: false }
                      - {
                          label: 右側圖片或 Logo,
                          name: logo,
                          widget: image,
                          required: false,
                          hint: '選填；圖片會以淡色浮水印顯示於卡片右側，建議使用透明背景。'
                        }
                      - {
                          label: 顯示右側 Logo,
                          name: showLogo,
                          widget: boolean,
                          default: true,
                          required: false
                        }
                      - { label: 內容, name: content, widget: markdown, required: false }
              - &feature_cards
                label: 圖文卡片（Feature Cards）
                name: feature-cards
                widget: object
                summary: '圖文卡片（Feature Cards） · {{fields.title}}'
                fields: *feature_card_fields
              - &collapse_list
                label: Collapse
                name: collapse-list
                widget: object
                summary: 'Collapse · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 收合項目
                    name: items
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields: &markdown_items
                      - { label: 標題, name: title, widget: string }
                      - { label: 內容, name: content, widget: markdown, required: false }
              - &aside
                label: Aside
                name: aside
                widget: object
                summary: 'Aside · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 樣式
                    name: variant
                    widget: select
                    default: note
                    options: [note, tip, caution, danger]
                  - { label: 內容, name: content, widget: markdown, required: false }
              - &tabs
                label: Tabs
                name: tabs
                widget: object
                summary: 'Tabs · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - { label: 分頁, name: tabs, widget: list, min: 1, fields: *markdown_items }
              - &steps
                label: Steps
                name: steps
                widget: object
                summary: 'Steps · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - { label: 步驟, name: steps, widget: list, min: 1, fields: *markdown_items }
              - &timeline
                label: Timeline
                name: timeline
                widget: object
                summary: 'Timeline · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - { label: 區塊說明, name: description, widget: text, required: false }
                  - label: 時間點
                    name: events
                    widget: list
                    add_to_top: true
                    hint: 新增時間點會放在最上方，可拖曳調整順序；日期也可填入「???」。
                    required: false
                    summary: '{{fields.date}} · {{fields.content}}'
                    fields:
                      - { label: 日期, name: date, widget: string }
                      - { label: 內容, name: content, widget: text }
                      - { label: 相關網址, name: link, widget: string, required: false }
                      - { label: 連結文字, name: linkLabel, widget: string, required: false }
              - &buttons
                label: Buttons
                name: buttons
                widget: object
                summary: 'Buttons · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 按鈕
                    name: buttons
                    widget: list
                    min: 1
                    fields:
                      - { label: 文字, name: label, widget: string }
                      - { label: 網址, name: href, widget: string }
                      - {
                          label: 樣式,
                          name: variant,
                          widget: select,
                          default: primary,
                          options: [primary, secondary, outline]
                        }
              - label: Latest Posts
                name: latest-posts
                widget: object
                summary: 'Latest Posts · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - {
                      label: 文章數量,
                      name: limit,
                      widget: number,
                      value_type: int,
                      min: 1,
                      max: 20,
                      default: 10
                    }
                  - { label: 按鈕文字, name: buttonLabel, widget: string, required: false }
                  - { label: 按鈕網址, name: buttonUrl, widget: string, required: false }
              - label: Skill Groups
                name: skill-groups
                widget: object
                summary: 'Skill Groups · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 技能群組
                    name: groups
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { label: 群組名稱, name: title, widget: string }
                      - { label: 顯示群組, name: visible, widget: boolean, default: true }
                      - {
                          label: 技能,
                          name: skills,
                          widget: list,
                          field: { label: 技能, name: skill, widget: string }
                        }
              - label: Website Cards
                name: website-cards
                widget: object
                summary: 'Website Cards · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 網站卡片
                    name: cards
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { label: 名稱, name: title, widget: string }
                      - { label: 說明, name: description, widget: text, required: false }
                      - { label: 圖片, name: image, widget: image, required: false }
                      - { label: 網址, name: href, widget: string }

      - name: blog
        preview_path: blog
        label: Blog
        file: src/data/pages/blog.json
        format: json
        fields:
          [
            *key,
            *title,
            *nav_label,
            *path,
            *nav_order,
            *enabled,
            *show_nav,
            *view,
            *comment,
            *description,
            {
              label: Content Blocks,
              name: blocks,
              widget: list,
              typeKey: type,
              required: false,
              default: [],
              types:
                [
                  *rich_text,
                  *feature_cards,
                  *card_list,
                  *collapse_list,
                  *aside,
                  *tabs,
                  *steps,
                  *timeline,
                  *buttons
                ]
            }
          ]
      - name: docs
        preview_path: docs
        label: Docs
        file: src/data/pages/docs.json
        format: json
        fields:
          [
            *key,
            *title,
            *nav_label,
            *path,
            *nav_order,
            *enabled,
            *show_nav,
            *view,
            *comment,
            *description,
            {
              label: Content Blocks,
              name: blocks,
              widget: list,
              typeKey: type,
              required: false,
              default: [],
              types:
                [
                  *rich_text,
                  *feature_cards,
                  *card_list,
                  *collapse_list,
                  *aside,
                  *tabs,
                  *steps,
                  *timeline,
                  *buttons
                ]
            }
          ]
      - name: projects
        preview_path: projects
        label: Projects
        file: src/data/pages/projects.json
        format: json
        fields:
          - *key
          - *title
          - *nav_label
          - *path
          - *nav_order
          - *enabled
          - *show_nav
          - *view
          - *comment
          - *description
          - label: Content Blocks
            name: blocks
            widget: list
            required: false
            typeKey: type
            types:
              - *rich_text
              - *card_list
              - *feature_cards
              - *collapse_list
              - *aside
              - *tabs
              - *steps
              - *timeline
              - *buttons
              - &project_grid
                label: Project Grid
                name: project-grid
                widget: object
                summary: 'Project Grid · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 專案分類
                    name: groups
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { label: 分類名稱, name: title, widget: string }
                      - { label: 分類說明, name: description, widget: text, required: false }
                      - { label: 顯示分類, name: visible, widget: boolean, default: true }
                      - { label: 預設收合, name: collapsed, widget: boolean, default: false }
                      - label: Projects
                        name: projects
                        widget: list
                        required: false
                        summary: '{{fields.name}}'
                        fields:
                          - { label: 名稱, name: name, widget: string }
                          - { label: 說明, name: description, widget: text, required: false }
                          - { label: 圖片, name: image, widget: image, required: false }
                          - { label: 顯示, name: visible, widget: boolean, default: true }
                          - label: 相關連結
                            name: links
                            widget: list
                            required: false
                            fields:
                              - {
                                  label: 類型,
                                  name: type,
                                  widget: select,
                                  options: [github, site, doc, release]
                                }
                              - { label: 網址, name: href, widget: string }

      - name: links
        preview_path: links
        label: Links
        file: src/data/pages/links.json
        format: json
        fields:
          - *key
          - *title
          - *nav_label
          - *path
          - *nav_order
          - *enabled
          - *show_nav
          - *view
          - *comment
          - *description
          - label: Content Blocks
            name: blocks
            widget: list
            required: false
            typeKey: type
            types:
              - *rich_text
              - *collapse_list
              - *aside
              - *tabs
              - *steps
              - *timeline
              - *buttons
              - *feature_cards
              - label: Link Grid
                name: link-grid
                widget: object
                summary: 'Link Grid · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: Links 群組
                    name: groups
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { label: 群組名稱, name: title, widget: string }
                      - { label: 群組說明, name: description, widget: text, required: false }
                      - { label: 顯示群組, name: visible, widget: boolean, default: true }
                      - { label: 預設收合, name: collapsed, widget: boolean, default: false }
                      - { label: 隨機排序, name: randomize, widget: boolean, default: true }
                      - label: Links
                        name: links
                        widget: list
                        required: false
                        summary: '{{fields.name}}'
                        fields:
                          - { label: 名稱, name: name, widget: string }
                          - { label: 簡介, name: intro, widget: string, required: false }
                          - { label: 網址, name: link, widget: string }
                          - { label: Avatar, name: avatar, widget: image, choose_url: true }
                          - { label: 顯示, name: visible, widget: boolean, default: true }
              - label: Link History
                name: link-history
                widget: object
                summary: 'Link History · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - label: 紀錄
                    name: events
                    widget: list
                    required: false
                    summary: '{{fields.date}} · {{fields.name}}'
                    fields:
                      - { label: 日期, name: date, widget: string }
                      - { label: 網站名稱, name: name, widget: string }
                      - {
                          label: 狀態,
                          name: status,
                          widget: select,
                          options: [added, updated, removed]
                        }
                      - { label: 備註, name: content, widget: text, required: false }
              - label: Apply Links
                name: apply-links
                widget: object
                summary: 'Apply Links · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - { label: 申請說明, name: content, widget: markdown, required: false }
                  - {
                      label: Pull Request 網址,
                      name: pullRequestUrl,
                      widget: string,
                      required: false
                    }

      - name: about
        preview_path: about
        label: About
        file: src/data/pages/about.json
        format: json
        fields:
          - *key
          - *title
          - *nav_label
          - *path
          - *nav_order
          - *enabled
          - *show_nav
          - *view
          - *comment
          - *description
          - label: Content Blocks
            name: blocks
            widget: list
            required: false
            typeKey: type
            types:
              - *rich_text
              - *card_list
              - *feature_cards
              - *collapse_list
              - *aside
              - *tabs
              - *steps
              - *timeline
              - *buttons
              - label: Tool Grid
                name: tool-grid
                widget: object
                summary: 'Tool Grid · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - { label: 區塊說明, name: description, widget: text, required: false }
                  - label: 工具群組
                    name: groups
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { label: 群組名稱, name: title, widget: string }
                      - { label: 顯示群組, name: visible, widget: boolean, default: true }
                      - label: 工具
                        name: tools
                        widget: list
                        required: false
                        summary: '{{fields.name}} · {{fields.description}}'
                        fields:
                          - { label: 名稱, name: name, widget: string }
                          - { label: 說明, name: description, widget: string, required: false }
                          - { label: 網址, name: href, widget: string }
                          - { label: 圖示, name: icon, widget: image, choose_url: true }
                          - {
                              label: 深色模式圖示,
                              name: darkIcon,
                              widget: image,
                              choose_url: true,
                              required: false
                            }
                          - { label: 顯示, name: visible, widget: boolean, default: true }
              - label: Signature
                name: signature
                widget: object
                summary: 'Signature · {{fields.title}}'
                fields:
                  - *block_id
                  - *block_title
                  - *block_visible
                  - *block_heading
                  - *block_toc
                  - { label: 簽名 SVG, name: src, widget: file, required: false, choose_url: false }
                  - { label: 替代文字, name: alt, widget: string, default: xhA signature }
                  - {
                      label: 動畫模式,
                      name: mode,
                      widget: select,
                      default: once-on-view,
                      options: [static, once-on-view, loop]
                    }
                  - {
                      label: 對齊,
                      name: align,
                      widget: select,
                      default: right,
                      options: [left, center, right]
                    }
                  - {
                      label: 寬度（px）,
                      name: width,
                      widget: number,
                      value_type: int,
                      min: 80,
                      max: 640,
                      default: 160
                    }
                  - {
                      label: 每筆間隔（ms）,
                      name: drawDelay,
                      widget: number,
                      value_type: int,
                      default: 200
                    }
                  - {
                      label: 回收間隔（ms）,
                      name: rollbackDelay,
                      widget: number,
                      value_type: int,
                      default: 80
                    }
                  - {
                      label: 循環停留（ms）,
                      name: loopPause,
                      widget: number,
                      value_type: int,
                      default: 2000
                    }
                  - {
                      label: 單筆時間（ms）,
                      name: defaultDuration,
                      widget: number,
                      value_type: int,
                      default: 600
                    }

  - name: blog
    preview_path: blog/{{slug}}
    label: Blog
    label_singular: Blog
    folder: src/content/blog
    create: true
    extension: mdx
    format: frontmatter
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    identifier_field: title
    summary: '{{title}} — {{publishDate}}'
    sortable_fields: [publishDate, updatedDate, title]
    view_filters:
      - { label: 草稿, field: draft, pattern: 'true' }
      - { label: 已發布, field: draft, pattern: 'false' }
    fields: &article_fields
      - { label: 標題, name: title, widget: string, pattern: ['^.{1,60}$', 標題不可超過 60 個字元] }
      - {
          label: 摘要,
          name: description,
          widget: text,
          pattern: ['^.{1,160}$', 摘要不可超過 160 個字元]
        }
      - {
          label: 發布日期,
          name: publishDate,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD
        }
      - {
          label: 更新日期,
          name: updatedDate,
          widget: datetime,
          required: false,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD
        }
      - label: 封面圖片
        name: heroImage
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 圖片, name: src, widget: image, choose_url: false }
          - { label: 替代文字, name: alt, widget: string, required: false }
          - {
              label: 主題色,
              name: color,
              widget: string,
              required: false,
              pattern: ['^#[0-9a-fA-F]{6}$', 請輸入六位十六進位色碼]
            }
      - {
          label: 標籤,
          name: tags,
          widget: list,
          required: false,
          default: [],
          field: { label: 標籤, name: tag, widget: string }
        }
      - label: 語言
        name: language
        widget: select
        required: false
        default: zh-TW
        options:
          - { label: 繁體中文, value: zh-TW }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 開放留言, name: comment, widget: boolean, default: true }
      - label: 內文
        name: body
        widget: markdown
        editor_components:
          [
            cms-aside,
            cms-collapse,
            cms-tabs,
            cms-steps,
            cms-timeline,
            cms-signature,
            cms-buttons,
            image,
            code-block
          ]

  - name: docs
    preview_path: docs/{{slug}}
    label: Docs
    label_singular: Doc
    description: Docs 頁面預設停用；準備好內容後再到「頁面與導覽」開啟。
    folder: src/content/docs
    create: true
    extension: mdx
    format: frontmatter
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    identifier_field: title
    sortable_fields: [category, order, title]
    view_filters:
      - { label: 草稿, field: draft, pattern: 'true' }
      - { label: 已發布, field: draft, pattern: 'false' }
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 說明, name: description, widget: text, required: false }
      - { label: 分類, name: category, widget: string, default: General }
      - { label: 順序, name: order, widget: number, value_type: int, default: 0 }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 開放留言, name: comment, widget: boolean, default: false }
      - {
          label: 更新日期,
          name: updatedDate,
          widget: datetime,
          required: false,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD
        }
      - label: 內文
        name: body
        widget: markdown
        editor_components:
          [
            cms-aside,
            cms-collapse,
            cms-tabs,
            cms-steps,
            cms-timeline,
            cms-signature,
            cms-buttons,
            image,
            code-block
          ]
